<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>S-Blue | Internal Management Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-6">

    <div class="w-full max-w-sm bg-white/5 backdrop-blur-md p-8 rounded-2xl border border-white/10 shadow-2xl">
        <div class="text-center mb-8">
            <div class="bg-blue-600 w-12 h-12 rounded-xl mx-auto mb-3 flex items-center justify-center shadow-lg shadow-blue-500/30">
                <span class="text-white font-black text-xl">S</span>
            </div>
            <h1 class="text-white font-black tracking-tight text-lg uppercase">Internal Command Terminal</h1>
            <p class="text-blue-400 text-[10px] font-bold uppercase tracking-[0.2em] mt-1">Staff Operators Only</p>
        </div>

        <form action="/auth/login" method="POST" class="space-y-4">
            <div>
                <input type="text" name="username" placeholder="Staff Account ID" required class="w-full p-3 rounded-xl bg-white/10 border border-white/10 text-white text-sm placeholder-white/20 outline-none focus:border-blue-500 transition">
            </div>
            <div>
                <input type="password" name="password" placeholder="System Security Key" required class="w-full p-3 rounded-xl bg-white/10 border border-white/10 text-white text-sm placeholder-white/20 outline-none focus:border-blue-500 transition">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-md transition uppercase text-xs tracking-widest">Initialize Admin Session</button>
        </form>
        
        <div class="mt-8 text-center">
            <a href="/" class="text-white/30 text-[10px] font-bold uppercase hover:text-white transition">← Exit Node</a>
        </div>
    </div>

</body>
</html>
